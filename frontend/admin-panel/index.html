<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gerenciamento de Coletas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
        }
        .nav-link {
            color: #495057;
        }
        .nav-link.active {
            color: #0d6efd;
            font-weight: bold;
        }
        .order-card {
            transition: transform 0.2s;
        }
        .order-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #map {
            height: 400px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar py-3">
                <h4 class="text-center mb-4">Sistema de Coletas</h4>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" href="#dashboard" data-bs-toggle="tab">
                            <i class="bi bi-speedometer2 me-2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#orders" data-bs-toggle="tab">
                            <i class="bi bi-cart me-2"></i> Pedidos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#delivery-men" data-bs-toggle="tab">
                            <i class="bi bi-person-badge me-2"></i> Motoboys
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#routes" data-bs-toggle="tab">
                            <i class="bi bi-geo-alt me-2"></i> Rotas
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#users" data-bs-toggle="tab">
                            <i class="bi bi-people me-2"></i> Usuários
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#settings" data-bs-toggle="tab">
                            <i class="bi bi-gear me-2"></i> Configurações
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Main content -->
            <div class="col-md-9 col-lg-10 ms-sm-auto px-4 py-3">
                <div class="tab-content">
                    <!-- Dashboard -->
                    <div class="tab-pane fade show active" id="dashboard">
                        <h2 class="mb-4">Dashboard</h2>
                        <div class="row">
                            <div class="col-md-3 mb-4">
                                <div class="card bg-primary text-white text-center p-3">
                                    <h5>Pedidos Pendentes</h5>
                                    <h2 id="pending-orders">0</h2>
                                </div>
                            </div>
                            <div class="col-md-3 mb-4">
                                <div class="card bg-success text-white text-center p-3">
                                    <h5>Pedidos Coletados</h5>
                                    <h2 id="collected-orders">0</h2>
                                </div>
                            </div>
                            <div class="col-md-3 mb-4">
                                <div class="card bg-info text-white text-center p-3">
                                    <h5>Motoboys Ativos</h5>
                                    <h2 id="active-delivery-men">0</h2>
                                </div>
                            </div>
                            <div class="col-md-3 mb-4">
                                <div class="card bg-warning text-white text-center p-3">
                                    <h5>Rotas em Andamento</h5>
                                    <h2 id="active-routes">0</h2>
                                </div>
                            </div>
                        </div>

                        <div class="row mt-4">
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h5>Últimos Pedidos</h5>
                                    </div>
                                    <div class="card-body">
                                        <div id="recent-orders" class="list-group">
                                            <!-- Pedidos serão carregados via JavaScript -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h5>Localização dos Motoboys</h5>
                                    </div>
                                    <div class="card-body">
                                        <div id="map"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Outras abas (Pedidos, Motoboys, Rotas, Usuários, Configurações) -->
                    <!-- O código completo teria implementações semelhantes para essas abas -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // Inicialização do mapa (exemplo com Leaflet)
        function initMap() {
            // Esta é uma implementação simplificada
            console.log("Mapa inicializado");
        }

        // Carregar dados do dashboard
        async function loadDashboardData() {
            try {
                const response = await axios.get('/api/orders/stats');
                document.getElementById('pending-orders').textContent = response.data.pending;
                document.getElementById('collected-orders').textContent = response.data.collected;
                
                // Carregar pedidos recentes
                const ordersResponse = await axios.get('/api/orders?limit=5');
                const ordersList = document.getElementById('recent-orders');
                ordersList.innerHTML = '';
                
                ordersResponse.data.forEach(order => {
                    const orderItem = document.createElement('div');
                    orderItem.className = 'list-group-item';
                    orderItem.innerHTML = `
                        <div class="d-flex w-100 justify-content-between">
                            <h6 class="mb-1">${order.order_number} - ${order.supplier}</h6>
                            <small>R$ ${order.value}</small>
                        </div>
                        <p class="mb-1">${order.construction_site}</p>
                        <small>${new Date(order.order_date).toLocaleDateString()}</small>
                    `;
                    ordersList.appendChild(orderItem);
                });
            } catch (error) {
                console.error('Erro ao carregar dados do dashboard:', error);
            }
        }

        // Inicializar quando o documento estiver pronto
        document.addEventListener('DOMContentLoaded', function() {
            initMap();
            loadDashboardData();
        });
    </script>
</body>
</html>
