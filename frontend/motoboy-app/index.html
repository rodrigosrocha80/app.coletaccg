<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Motoboy - Sistema de Coletas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        #map {
            height: 300px;
            border-radius: 8px;
        }
        .order-item {
            border-left: 4px solid #0d6efd;
        }
        .order-item.completed {
            border-left-color: #198754;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-3">
        <!-- Cabeçalho com login/logout -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>Sistema de Coletas</h3>
            <button id="login-btn" class="btn btn-outline-primary">Entrar</button>
        </div>

        <!-- Tela de Login -->
        <div id="login-section" class="card p-4 mb-4">
            <h4 class="mb-3">Acesso do Motoboy</h4>
            <form id="login-form">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
        </div>

        <!-- Conteúdo principal (após login) -->
        <div id="main-content" class="d-none">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 id="welcome-message">Olá, Motoboy</h4>
                <button id="logout-btn" class="btn btn-outline-danger btn-sm">Sair</button>
            </div>

            <!-- Rota Ativa -->
            <div id="active-route" class="card mb-4 d-none">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Rota em Andamento</h5>
                </div>
                <div class="card-body">
                    <h6 id="route-name"></h6>
                    <div class="progress mb-3">
                        <div id="route-progress" class="progress-bar" role="progressbar" style="width: 0%"></div>
                    </div>
                    <button id="complete-route-btn" class="btn btn-success btn-sm">Finalizar Rota</button>
                </div>
            </div>

            <!-- Lista de Pedidos -->
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="mb-0">Pedidos para Coleta</h5>
                </div>
                <div class="card-body">
                    <div id="orders-list">
                        <!-- Pedidos serão carregados via JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Mapa -->
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">Localização</h5>
                </div>
                <div class="card-body">
                    <div id="map"></div>
                    <div class="form-check mt-3">
                        <input class="form-check-input" type="checkbox" id="share-location">
                        <label class="form-check-label" for="share-location">
                            Compartilhar localização em tempo real
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // Variáveis globais
        let currentUser = null;
        let watchId = null;

        // Elementos DOM
        const loginSection = document.getElementById('login-section');
        const mainContent = document.getElementById('main-content');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const loginForm = document.getElementById('login-form');
        const welcomeMessage = document.getElementById('welcome-message');
        const ordersList = document.getElementById('orders-list');
        const shareLocationCheckbox = document.getElementById('share-location');
        const activeRouteSection = document.getElementById('active-route');
        const routeName = document.getElementById('route-name');
        const routeProgress = document.getElementById('route-progress');
        const completeRouteBtn = document.getElementById('complete-route-btn');

        // Event Listeners
        loginForm.addEventListener('submit', handleLogin);
        logoutBtn.addEventListener('click', handleLogout);
        shareLocationCheckbox.addEventListener('change', handleLocationSharing);

        // Função de login
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // Verificar primeiro na tabela de delivery_men
                const deliveryMenResponse = await axios.get('http://localhost:3000/api/delivery-men');
                const deliveryMan = deliveryMenResponse.data.find(dm => dm.email === email);
                
                if (deliveryMan) {
                    // Se encontrou no cadastro de motoboys, fazer login
                    currentUser = deliveryMan;
                    welcomeMessage.textContent = `Olá, ${currentUser.name}`;
                    loginSection.classList.add('d-none');
                    mainContent.classList.remove('d-none');
                    loadOrders();
                    checkActiveRoute();
                } else {
                    // Se não encontrou, tentar login na tabela de users
                    const userResponse = await axios.post('http://localhost:3000/api/users/login', {
                        email,
                        password,
                        role: 'delivery_man'
                    });

                    if (userResponse.data.success) {
                        currentUser = userResponse.data.user;
                        welcomeMessage.textContent = `Olá, ${currentUser.name}`;
                        loginSection.classList.add('d-none');
                        mainContent.classList.remove('d-none');
                        loadOrders();
                        checkActiveRoute();
                    } else {
                        alert('Credenciais inválidas');
                    }
                }
            } catch (error) {
                console.error('Erro no login:', error);
                alert('Erro ao fazer login. Verifique o servidor.');
            }
        }

        // Função de logout
        function handleLogout() {
            currentUser = null;
            mainContent.classList.add('d-none');
            loginSection.classList.remove('d-none');
            
            // Parar de compartilhar localização
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
        }

        // Carregar pedidos
        async function loadOrders() {
            try {
                const response = await axios.get('http://localhost:3000/api/orders?status=pending');
                ordersList.innerHTML = '';
                
                response.data.forEach(order => {
                    const orderElement = document.createElement('div');
                    orderElement.className = 'order-item p-3 mb-2 bg-white rounded';
                    orderElement.innerHTML = `
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="mb-0">${order.order_number}</h6>
                                <small>${order.supplier} - ${order.construction_site}</small>
                            </div>
                            <button class="btn btn-sm btn-outline-primary collect-btn" data-id="${order.id}">Coletar</button>
                        </div>
                    `;
                    ordersList.appendChild(orderElement);
                });

                // Adicionar event listeners aos botões de coleta
                document.querySelectorAll('.collect-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const orderId = btn.getAttribute('data-id');
                        collectOrder(orderId);
                    });
                });
            } catch (error) {
                console.error('Erro ao carregar pedidos:', error);
                ordersList.innerHTML = '<div class="text-center text-muted">Erro ao carregar pedidos</div>';
            }
        }

        // Coletar pedido
        async function collectOrder(orderId) {
            try {
                await axios.put(`http://localhost:3000/api/orders/${orderId}`, {
                    status: 'collected',
                    collected_by: currentUser.id
                });
                alert('Pedido coletado com sucesso!');
                loadOrders();
            } catch (error) {
                console.error('Erro ao coletar pedido:', error);
                alert('Erro ao registrar coleta');
            }
        }

        // Verificar rota ativa
        async function checkActiveRoute() {
            try {
                const response = await axios.get(`http://localhost:3000/api/routes/active/${currentUser.id}`);
                if (response.data.active) {
                    activeRouteSection.classList.remove('d-none');
                    routeName.textContent = response.data.route.name;
                    routeProgress.style.width = `${response.data.progress}%`;
                    
                    completeRouteBtn.addEventListener('click', () => {
                        completeRoute(response.data.route.id);
                    });
                } else {
                    activeRouteSection.classList.add('d-none');
                }
            } catch (error) {
                console.error('Erro ao verificar rota ativa:', error);
            }
        }

        // Compartilhar localização
        function handleLocationSharing(e) {
            if (e.target.checked) {
                if (navigator.geolocation) {
                    watchId = navigator.geolocation.watchPosition(
                        (position) => {
                            const { latitude, longitude } = position.coords;
                            sendLocation(latitude, longitude);
                        },
                        (error) => {
                            console.error('Erro ao obter localização:', error);
                            alert('Não foi possível obter a localização');
                            shareLocationCheckbox.checked = false;
                        },
                        { 
                            enableHighAccuracy: true,
                            timeout: 10000,
                            maximumAge: 0
                        }
                    );
                } else {
                    alert('Geolocalização não é suportada pelo seu navegador');
                    shareLocationCheckbox.checked = false;
                }
            } else if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
        }

        // Enviar localização para o servidor
        async function sendLocation(lat, lng) {
            try {
                await axios.post('http://localhost:3000/api/routes/location', {
                    delivery_man_id: currentUser.id,
                    latitude: lat,
                    longitude: lng
                });
            } catch (error) {
                console.error('Erro ao enviar localização:', error);
            }
        }

        // Inicializar quando o documento estiver pronto
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar se já está logado (exemplo simples)
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                welcomeMessage.textContent = `Olá, ${currentUser.name}`;
                loginSection.classList.add('d-none');
                mainContent.classList.remove('d-none');
                loadOrders();
                checkActiveRoute();
            }
            
            // Botão de login visível
            loginBtn.addEventListener('click', function() {
                loginSection.classList.remove('d-none');
            });
        });
    </script>
</body>
</html>
